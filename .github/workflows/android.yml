name: Build Pandoo APK

on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - 'client/**'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and sync Capacitor
        run: |
          npm ci
          npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pandoo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: pandoo-apk
          path: ./apk

      - name: Rename APK
        run: mv ./apk/app-debug.apk ./apk/pandoo.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Pandoo APK (latest build)"
          body: "Latest Pandoo Android app build. Download pandoo.apk and install on your phone."
          files: ./apk/pandoo.apk
